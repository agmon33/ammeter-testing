testing:
  sampling:
    measurements_count: 10
    total_duration_seconds: 5
    sampling_frequency_hz: 2

ammeters:
 greenlee:
   port: 5001
   command: "MEASURE_GREENLEE -get_measurement"
 entes:
   port: 5002
   command: "MEASURE_ENTES -get_data"
 circutor:
   port: 5003
   command: "MEASURE_CIRCUTOR -get_measurement -current"

analysis:
  statistical_metrics: [mean, median, std, min, max]
  visualization:
    enabled: true
    plot_types: [line, histogram, boxplot]

result_management:
  results_dir: results
